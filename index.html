<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Any Weapon You Want! AWYW</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Any Weapon You Want!</h1>

        <nav>
            <a href="index.html">Главная</a>
            <a href="#catalog">Каталог</a>
            <a href="#cart">Корзина</a>
        </nav>
    </header>

    <main>
        <section id="catalog">
            <h2>Каталог товаров со всего мира</h2>
            <div class="catalog-controls">
                <div class="catalog-control-filters">
                    <div class="category-filter">
                        <p>Категория</p>
                        <div class="category-filter-list"></div>
                    </div>
                    <div class="country-filter">
                        <p>Категория</p>
                        <div class="country-filter-list"></div>
                    </div>
                </div>

                <div class="catalog-control-sorting">
                    <button type="button" id="sort-price">
                        Цена ↕
                    </button>
                    <button type="button" id="sort-title">
                        Название ↕
                    </button>

                </div>
            </div>

            <div class="catalog-list">

            </div>


        </section>
        <section id="cart">

            <h2>Корзина</h2>
            <div class="cart-list">

            </div>

            <div class="cart-total">

            </div>

            <button type="button" class="cart-button">Оформить заказ</button>

        </section>

    </main>
<script src="js/script.js"></script>
</body>
